<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="digitGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main background -->
  <rect width="32" height="32" rx="8" fill="url(#bgGradient)"/>
  
  <!-- Letter "P" in digital style -->
  <rect x="6" y="6" width="2" height="12" fill="url(#digitGradient)"/>
  <rect x="6" y="6" width="8" height="2" fill="url(#digitGradient)"/>
  <rect x="12" y="6" width="2" height="5" fill="url(#digitGradient)"/>
  <rect x="6" y="11" width="8" height="2" fill="url(#digitGradient)"/>
  
  <!-- Digital numbers "01" -->
  <rect x="16" y="8" width="2" height="8" fill="#f59e0b"/>
  <rect x="16" y="6" width="4" height="2" fill="#f59e0b"/>
  <rect x="16" y="16" width="4" height="2" fill="#f59e0b"/>
  <rect x="18" y="8" width="2" height="8" fill="#f59e0b"/>
  
  <rect x="22" y="6" width="2" height="12" fill="#ef4444"/>
  
  <!-- Trading signal indicator dots -->
  <circle cx="26" cy="24" r="1.5" fill="#10b981"/>
  <circle cx="29" cy="26" r="1" fill="#f59e0b" opacity="0.8"/>
  <circle cx="23" cy="26" r="1" fill="#ef4444" opacity="0.6"/>
</svg>